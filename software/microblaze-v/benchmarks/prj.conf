# Periféricos básicos
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_PRINTK=y
CONFIG_UART_CONSOLE=y

# Configuración de Librería C para evitar errores de enlazado
CONFIG_PICOLIBC=n
CONFIG_MINIMAL_LIBC=y


CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CPU_HAS_FPU=y
CONFIG_FPU=y
CONFIG_FLOAT_HARD=y
